# Hạ tầng dữ liệu dev RIÊNG cho dự án: Postgres (DB + user riêng từng service) và Redis (ACL theo service).
# Xem infra/docker/README.md. Mọi tên đều có tiền tố `mp-dev` / `mp_dev` và được đặt TƯỜNG MINH để không
# bao giờ trùng hay ghi đè tài nguyên của project khác trên máy (từng xảy ra khi thiếu `name:`).
#   docker compose -f infra/docker/compose.dev.yml up -d
name: manager-platform-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: mp-dev-postgres
    environment:
      POSTGRES_PASSWORD: dev_postgres_admin_change_me
    ports: ["127.0.0.1:55440:5432"]
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - mp_dev_pgdata:/var/lib/postgresql/data
    networks: [mp_dev_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mp-dev-redis
    command: ["redis-server", "--aclfile", "/etc/redis/users.acl", "--appendonly", "yes"]
    ports: ["127.0.0.1:56390:6379"]
    volumes:
      - ./redis/users.acl:/etc/redis/users.acl:ro
      - mp_dev_redisdata:/data
    networks: [mp_dev_net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user analytics_cache --pass dev_analytics_change_me --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  mp_dev_net:
    name: mp_dev_net

volumes:
  mp_dev_pgdata:
    name: mp_dev_pgdata
  mp_dev_redisdata:
    name: mp_dev_redisdata
