# Reverse proxy cho máy chủ LAN: phục vụ manager-web (SPA tĩnh) và chuyển /v1/* sang gateway (cùng origin => không cần CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4m;
    server_tokens off;

    location /v1/ {
        proxy_pass http://gateway:8400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # ghi đè, KHÔNG nối thêm giá trị client tự gửi
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /internal/ { return 404; }                  # đường nội bộ không bao giờ ra ngoài

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
