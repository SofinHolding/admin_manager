# Cloudflare Tunnel RIÊNG của dự án (tunnel local-config: cloudflared tunnel create + route dns). Chạy SAU web.yml.
# Thư mục .dev/cloudflared/ (KHÔNG commit) chứa đúng 2 file:
#   <tunnel-id>.json   credentials của tunnel này (sinh bởi `cloudflared tunnel create statsdash-tunnel`)
#   config.yml         tunnel: <id> / credentials-file: /etc/cloudflared/<id>.json / ingress: statsdash.dnlabs.space -> http://mp-web:80
# TUYỆT ĐỐI không mount ~/.cloudflared (có cert.pem = quyền tạo/xóa tunnel của cả tài khoản).
#   docker compose -f infra/deploy/lan/tunnel.yml up -d
name: manager-platform-tunnel

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    container_name: mp-tunnel
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ../../../.dev/cloudflared:/etc/cloudflared:ro
    networks: [mp_dev_net]

networks:
  mp_dev_net:
    external: true
    name: mp_dev_net
