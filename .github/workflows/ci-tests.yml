name: CI tests (chạy tay)

# CHỈ chạy test, KHÔNG deploy. Trigger tự động đang tắt trong giai đoạn tái cấu trúc
# (xem CLAUDE.md mục 7 và tests/arch/test_ci_guard.py). Mỗi service test trong job riêng.
#
# Test DB của mọi service lấy DSN/secret từ hạ tầng DEV chuẩn của repo (infra/scripts/devenv.py đọc `.env.dev`):
# mỗi job cần DB tự dựng `bootstrap_dev.py` (sinh .env.dev ngẫu nhiên) + `docker compose ... up -d --wait`
# (Postgres 16 + Redis 7, DB và user riêng từng service, Redis ACL) — đúng như `python infra/scripts/test_all.py`.
# Không dùng `services: postgres` thuần vì thiếu user/DB riêng từng service và Redis ACL mà test cần.
# TEST_PG_*/TEST_REDIS_* khớp cổng compose.dev.yml (127.0.0.1:55440 / 26390). SKIP không phải PASS: job coi
# test cần hạ tầng mà bị SKIP là lỗi (bước "Không được SKIP vì thiếu hạ tầng").
on:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  TEST_PG_HOST: 127.0.0.1
  TEST_PG_PORT: "55440"
  TEST_REDIS_HOST: 127.0.0.1
  TEST_REDIS_PORT: "26390"

jobs:
  arch-and-contracts:
    name: Kiến trúc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tests/arch/requirements.txt fastapi httpx cryptography
      - run: cd tests/arch && python -m pytest -q -rs

  service:
    name: Service ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [identity-service, integration-service, analytics-service, reward-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cài thư viện
        run: pip install -r services/${{ matrix.service }}/requirements.txt cryptography pytest pytest-asyncio httpx pyyaml
      - name: Dựng hạ tầng DEV (Postgres 16 + Redis 7, stack mp-dev riêng)
        if: matrix.service != 'api-gateway'
        run: |
          python infra/scripts/bootstrap_dev.py
          docker compose --env-file .env.dev -f infra/docker/compose.dev.yml up -d --wait
      - name: Chạy test
        run: cd services/${{ matrix.service }} && python -m pytest -q -p no:cacheprovider -rs | tee /tmp/pytest.log
      - name: Không được SKIP vì thiếu hạ tầng
        if: matrix.service != 'api-gateway'
        run: "! grep -E 'SKIPPED .*(hạ tầng DEV|Postgres|Redis)' /tmp/pytest.log"

  packages:
    name: Package dùng chung
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install fastapi httpx pytest pytest-asyncio pydantic "pyjwt[crypto]" cryptography
      - run: cd packages/contracts/python && python -m pytest -q
      - run: cd packages/observability && python -m pytest -q
      - run: cd packages/sdk-python && python -m pytest -q

  e2e:
    name: E2E (tiến trình thật qua gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cài thư viện của mọi service
        run: |
          pip install -r services/identity-service/requirements.txt -r services/integration-service/requirements.txt -r services/analytics-service/requirements.txt -r services/reward-service/requirements.txt -r services/api-gateway/requirements.txt
          pip install pytest pytest-asyncio httpx pyyaml redis bcrypt cryptography
      - name: Dựng hạ tầng DEV (Postgres 16 + Redis 7, stack mp-dev riêng)
        run: |
          python infra/scripts/bootstrap_dev.py
          docker compose --env-file .env.dev -f infra/docker/compose.dev.yml up -d --wait
      - run: cd tests/e2e && python -m pytest -q -p no:cacheprovider -rs | tee /tmp/pytest.log
      - name: Hợp đồng (parity, reconcile — cần DB DEV)
        run: cd tests/contract && python -m pytest -q -p no:cacheprovider -rs | tee -a /tmp/pytest.log
      - name: Cách ly tiến trình thật (mỗi service một process; cần DB DEV)
        run: cd tests/integration && python -m pytest -q -p no:cacheprovider -rs | tee -a /tmp/pytest.log
      - name: Không được SKIP vì thiếu hạ tầng
        run: "! grep -E 'SKIPPED .*(hạ tầng DEV|Postgres|Redis)' /tmp/pytest.log"

  frontend:
    name: Frontend manager-web (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/manager-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/manager-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
